[package]
name = "kiosk-text-wasm"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
autohint = []

[dependencies]
skrifa = "=0.44.0"
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "simd"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
