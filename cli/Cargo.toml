[package]
name = "tirage-cli"
version = "0.0.1"
edition = "2024"
include = ["src/**"]
license = "AGPL-3.0-or-later"
license-file = "../LICENSE"
repository = "https://github.com/espadat-studio/tirage"
description = "Command line for tirage: derive a Recipe from a Seed, render it to PNG or SVG."

[[bin]]
name = "tirage"
path = "src/main.rs"

[features]
encode = ["dep:tirage-encode"]

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions", "string", "color"] }
clap_complete = "4"
dialoguer = { version = "0.12", default-features = false, features = ["fuzzy-select"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tirage = { path = "..", version = "2.0.0" }
tirage-encode = { path = "../encode", version = "0.0.1", optional = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
