[package]
name = "tirage-cli"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[[bin]]
name = "tirage"
path = "src/main.rs"

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions", "string", "color"] }
clap_complete = "4"
dialoguer = { version = "0.12", default-features = false, features = ["fuzzy-select"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tirage = { path = ".." }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
