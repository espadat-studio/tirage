[package]
name = "tirage"
version = "2.0.1"
edition = "2024"
include = ["src/**", "fonts/**", "/README.md", "/LICENSE"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/espadat-studio/tirage"
description = "Original generative artwork and animations, rendered from code. A seeded Recipe in, pixels out."

[workspace]
members = ["cli", "encode"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
kurbo = "0.13"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skrifa = "0.44"
tiny-skia = "0.12"

[lints]
workspace = true

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = { version = "=0.48.1", default-features = false, features = ["raster-images"] }

[profile.dev.package."*"]
opt-level = 3
