[package]
name = "tirage"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
kurbo = "0.13"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.12"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
