[package]
name = "tirage"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace]
members = ["cli", "encode"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
kurbo = "0.13"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skrifa = "0.44"
tiny-skia = "0.12"

[lints]
workspace = true

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev.package."*"]
opt-level = 3
