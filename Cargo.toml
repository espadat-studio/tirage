[package]
name = "tirage"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]
members = ["encode"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions", "string"], optional = true }
kurbo = "0.13"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skrifa = "0.44"
tiny-skia = "0.12"

[lints]
workspace = true

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
cli = ["dep:clap"]

[[bin]]
name = "tirage"
path = "src/bin/tirage/main.rs"
required-features = ["cli"]

[[test]]
name = "cli"
required-features = ["cli"]

[profile.dev.package."*"]
opt-level = 3
