[settings]
idiomatic_version_file_enable_tools = ["rust"]
lockfile = true

[tools]
"aqua:apple/pkl" = "0.32.1"
"aqua:oxc-project/oxc/oxlint" = "1.84.0"
bun = "1.4.2"
"aqua:dprint/dprint" = "0.61.1"
"aqua:jdx/hk" = "2.5.0"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.148"
"aqua:zizmorcore/zizmor" = "1.30.1"

[tasks.build]
alias = "b"
description = "Build the workspace"
run = "cargo build --locked --workspace --all-features"

[tasks.fmt]
alias = "f"
description = "Format Rust and config files"
run = "hk fix --all"

[tasks.lint]
alias = "l"
description = "Check rustfmt, dprint, clippy, zizmor, oxlint and tsc"
depends = ["refs:install"]
run = "hk check --all"

[tasks.test]
alias = "t"
description = "Run all tests"
depends = ["refs:install"]
run = ["cargo nextest run --locked --workspace --all-features --no-tests=pass", "bun test --cwd refs"]

[tasks.wasm]
alias = "w"
description = "Build the core for wasm32-unknown-unknown"
run = "cargo build --locked --lib --target wasm32-unknown-unknown"

[tasks.check]
alias = "c"
description = "Lint, test and build wasm, as CI does"
depends = ["lint", "test", "wasm"]

[tasks."refs:install"]
description = "Install the refs script's locked dependencies"
dir = "refs"
run = "bun install --frozen-lockfile --silent"

[tasks."refs:typecheck"]
description = "Typecheck the refs script"
depends = ["refs:install"]
dir = "refs"
run = "bun x tsc -p ."

[tasks."refs:setup"]
description = "Install playwright-core's pinned Chromium"
depends = ["refs:install"]
dir = "refs"
run = "bun x playwright-core install chromium"

[tasks.refs]
description = "Export Reference exports from the live site: refs [--update] [tool...]. Never in CI"
depends = ["refs:setup"]
dir = "refs"
run = "bun export.ts"

[tasks."refs:smoke"]
description = "Export the smoke fixtures twice into a temp dir and check the bytes match"
depends = ["refs:setup"]
dir = "refs"
run = 'dir=$(mktemp -d) && cp smoke.json "$dir/manifest.json" && bun export.ts --manifest "$dir/manifest.json"'
