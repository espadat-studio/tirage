[workspace]
release_commits = "^(feat|fix|perf|refactor|build)(!|\\(|:)|^\\w+(\\([^)]*\\))?!:"
git_release_draft = true

[[package]]
name = "tirage"
git_tag_name = "v{{ version }}"

[[package]]
name = "tirage-encode"
git_tag_name = "tirage-encode-v{{ version }}"
git_release_enable = false

[[package]]
name = "tirage-cli"
git_release_enable = false
git_tag_name = "tirage-cli-v{{ version }}"
